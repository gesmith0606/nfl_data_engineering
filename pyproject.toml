# Installable view of the EXISTING layout (no file moves): src/*.py importable
# as top-level modules (`import projection_engine`, the sys.path-hack style)
# AND as `src.<module>` (repo-root style). The alias guard at the bottom of
# src/config.py keeps both names on one module object.
# New src/*.py files must be added to py-modules: tests/test_import_identity.py
# fails when this list goes stale.
[tool.setuptools]
py-modules = [
    "adp_prior",
    "adp_sources",
    "band_calibration",
