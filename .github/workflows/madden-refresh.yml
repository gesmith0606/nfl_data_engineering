name: Madden Ratings Refresh

# ---------------------------------------------------------------------------
# Triggers
# ---------------------------------------------------------------------------
# Weekly Wednesday 12:00 UTC — EA re-rates players every week during the
# season (iteration '1-base' → '2-week-1' → ... → '23-super-bowl') and
# updates the live ratings site by midweek. A weekly capture accumulates
# EA's curated form/injury signal as a candidate feature history; the
# script always fetches the newest iteration, so cadence only affects how
# many intermediate iterations we keep.
#
# Separate workflow file for the same reason as depthchart-capture.yml:
# adding this cron to odds-capture.yml would re-fire its unconditional
# Odds-API spreads job and burn API credits.
#
# workflow_dispatch for manual one-off runs:
#   gh workflow run madden-refresh.yml
on:
  schedule:
    - cron: "0 12 * * 3"   # 12:00 UTC Wednesdays
  workflow_dispatch: {}

concurrency:
  group: madden-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    name: Fetch and persist Madden ratings snapshot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # -----------------------------------------------------------------------
      # continue-on-error: true — the script fails loud (exit 1) on an
      # unmapped team label or an EA payload reshape (both happened at the
      # 2026 game rollover). That honest failure must not page via
      # notify-failure every week if EA's site is briefly down; the step
      # still shows red in the Actions UI, and nothing is committed below.
      # -----------------------------------------------------------------------
      - name: Fetch Madden ratings snapshot
        continue-on-error: true
        run: python scripts/refresh_madden_ratings.py

      # -----------------------------------------------------------------------
      # Commit new parquet back to the repo (TD-08/09 pattern, mirrors
      # depthchart-capture.yml: add only the specific path, skip empty,
      # rebase-and-retry up to 3x for concurrent pushes).
      # -----------------------------------------------------------------------
      - name: Commit ratings snapshot to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/bronze/madden_ratings/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No new Madden ratings to commit (fetch failed before any write)"
          else
            COUNT=$(git diff --cached --name-only | wc -l | tr -d ' ')

            git commit -m "data(madden): weekly ratings snapshot — ${COUNT} file(s)

          Automated weekly EA live-ratings capture (in-season re-rates)."

            for attempt in 1 2 3; do
              if git push origin main 2>&1; then
                echo "Pushed ${COUNT} Madden ratings file(s) (attempt ${attempt})"
                break
              fi
              echo "Push attempt ${attempt} rejected; rebasing onto origin/main..."
              git fetch origin main
              git rebase origin/main || {
                echo "::error::Rebase conflict on Madden data commit — manual intervention required"
                exit 1
              }
              if [ "$attempt" = "3" ]; then
                echo "::error::Push rejected 3 times after rebase — bailing"
                exit 1
              fi
            done
          fi

  # ---------------------------------------------------------------------------
  # Hard-failure notification — issue on job-level failure only (rebase
  # conflict, push rejection, runner error). Script-level fetch failures are
  # fail-open at the job level via continue-on-error above.
  # ---------------------------------------------------------------------------
  notify-failure:
    name: Notify on hard failure
    runs-on: ubuntu-latest
    needs: [refresh]
    if: failure()
    permissions:
      issues: write

    steps:
      - name: Create GitHub issue for refresh failure
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const now = new Date().toISOString().split('T')[0];
            const title = `Madden Ratings Refresh Failed - ${now}`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'pipeline-failure',
            });
            if (open.data.some(i => i.title === title)) {
              core.info('Failure issue already open today — not duplicating.');
              return;
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                '## Madden ratings weekly refresh hard failure',
                '',
                `Run: [${context.runId}](${runUrl})`,
                '',
                '```bash',
                'gh run view --log ' + context.runId,
                'gh workflow run madden-refresh.yml   # manual retry',
                '```',
                '',
                '_Auto-generated by madden-refresh notify-failure._',
              ].join('\n'),
              labels: ['pipeline-failure', 'automated'],
            });
