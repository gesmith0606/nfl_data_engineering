name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Frontend build gate — catches missing @/lib imports, broken routes,
  # and any TS/build-time failure before it can reach main.
  # ------------------------------------------------------------------
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    # No job-level path condition: the old guard read
    # github.event.pull_request.changed_files — a NUMBER in the PR payload —
    # so contains() was always false and this job SKIPPED on every PR
    # (frontend changes reached main unbuilt and untested until 2026-08-01).
    # The dorny/paths-filter steps below are the real gate; on PRs without
    # frontend changes every step no-ops and the job passes in seconds.
    steps:
      - uses: actions/checkout@v7

      - name: Detect changes to web/frontend
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'web/frontend/**'
              - '.github/workflows/ci.yml'

      - name: Setup Node.js
        if: steps.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: web/frontend
        run: npm ci

      - name: Unit tests (vitest)
        if: steps.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: web/frontend
        run: npm test

      - name: Build (catches missing imports, type errors, route errors)
        if: steps.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: web/frontend
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

  # ------------------------------------------------------------------
  # Backend test gate — pytest runs on any Python change.
  # ------------------------------------------------------------------
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Detect changes to Python code
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            python:
              - 'src/**'
              - 'web/api/**'
              - 'scripts/**'
              - 'tests/**'
              - 'requirements.txt'
              - '.github/workflows/ci.yml'

      - name: Setup Python
        if: steps.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            web/requirements.txt

      - name: Install dependencies
        if: steps.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch'
        # Root requirements lack the web API deps; the suite includes FastAPI
        # tests (tests/test_api_*.py, tests/web/) which import fastapi at
        # collection time and need httpx for TestClient. Without these every
        # backend run fails on ModuleNotFoundError before a single test runs.
        run: pip install -r requirements.txt -r web/requirements.txt httpx

      - name: Run pytest
        if: steps.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -o pipefail
          python -m pytest tests/ -q --tb=short 2>&1 | tee pytest_output.txt

      - name: Enforce warning budget
        if: steps.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch'
        # The suite once accumulated 12k warnings, which made new ones
        # invisible. Budget only ratchets DOWN: if the count drops, lower the
        # budget; only raise it for unavoidable third-party noise (prefer a
        # targeted filterwarnings entry in pytest.ini instead).
        run: |
          WARNINGS=$(grep -oE '[0-9]+ warnings' pytest_output.txt | tail -1 | grep -oE '[0-9]+' || echo 0)
          BUDGET=50
          echo "Suite emitted ${WARNINGS} warnings (budget: ${BUDGET})"
          if [ "${WARNINGS}" -gt "${BUDGET}" ]; then
            echo "::error::Warning count ${WARNINGS} exceeds budget ${BUDGET} — fix the new warnings (see pytest_output.txt) rather than raising the budget."
            exit 1
          fi

  # ------------------------------------------------------------------
  # Data completeness gate — fail-closed data-existence invariant check
  # (scripts/check_data_completeness.py --ci). Runs on every PR
  # unconditionally (no path filter): every prior silent hole in
  # .planning/DATA_COMPLETENESS_AUDIT.md had the same shape — a required
  # Bronze/Gold path went missing or partial and nothing signalled it
  # (the shipped RB_SNAP_COLLAPSE correction was a no-op in every
  # backtest ever run). --ci mode checks only committed=True manifest
  # entries — exactly what a fresh `git clone` gets, which is exactly
  # what deploy/huggingface/Dockerfile's clone-based prod deploy sees.
  # ------------------------------------------------------------------
  data-completeness:
    name: Data Completeness Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      # Only pyarrow is needed (Parquet footer metadata for the row-floor
      # checks) — no need to install the full requirements.txt for this gate.
      - name: Install dependencies
        run: pip install pyarrow==21.0.0

      - name: Check data completeness (committed paths only)
        run: python scripts/check_data_completeness.py --ci

  # ------------------------------------------------------------------
  # Model freshness gate — fail-closed model-staleness invariant check
  # (scripts/check_model_freshness.py), mirroring the data-completeness
  # gate above for MODEL_REVIEW_2026_08_15.md's finding class: a shipped
  # model artifact's frozen SimpleImputer silently drops now-real columns
  # from every future transform() forever (finding #1, confirmed against
  # models/quantile/imputer.pkl -- 28 NaN fit-time statistics, including
  # the entire snap_pct* family). --no-probe runs the artifact-only checks
  # (imputer NaN statistics, ensemble meta-learner shape) that need only
  # models/ (committed to git, unlike data/silver/ which is not) --
  # exactly what this job's fresh checkout has.
  #
  # *** continue-on-error: true is intentional and TEMPORARY. ***
  # models/quantile/imputer.pkl genuinely had 28 NaN fit-time statistics
  # (finding #1) when this gate was built; a concurrent retrain fixed it
  # mid-session (see .planning/MODEL_FRESHNESS_GUARDS.md section 2 for the
  # full before/after). continue-on-error stays wired regardless, because
  # (a) other WARN-tier staleness misses remain real and this job's FAIL
  # threshold could flip red again the moment another retrain lands, and
  # (b) this branch can't attest to what state models/ is in by the time it
  # merges to main -- several other workstreams have uncommitted changes to
  # models/ and the residual/quantile training code as of this commit.
  # TODO: once `python scripts/check_model_freshness.py --no-probe` has
  # been green on main for a while with no other workstream mid-retrain,
  # flip continue-on-error to false (or delete the line) -- leaving it
  # soft-fail indefinitely defeats the gate.
  # ------------------------------------------------------------------
  model-freshness:
    name: Model Freshness Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      # Full requirements.txt: unpickling shipped artifacts needs the same
      # sklearn/lightgbm/xgboost/catboost/joblib versions they were saved
      # with, not just pyarrow.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check model freshness (artifact-only; no local Silver in CI)
        continue-on-error: true  # TEMPORARY — see comment block above. Known-red on quantile until retrained.
        run: python scripts/check_model_freshness.py --no-probe

  # ------------------------------------------------------------------
  # Unpushed-commit drift detector — opens an alert if main has drifted
  # more than 10 commits ahead of the last deploy (runs on push to main).
  # ------------------------------------------------------------------
  deploy-drift-check:
    name: Deploy Drift Check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Report HEAD and last deploy tag
        run: |
          echo "HEAD: $(git rev-parse --short HEAD)"
          LAST_DEPLOY=$(git tag -l 'deploy-*' | sort -V | tail -1 || echo '')
          if [ -n "$LAST_DEPLOY" ]; then
            BEHIND=$(git rev-list --count "$LAST_DEPLOY..HEAD")
            echo "Commits since $LAST_DEPLOY: $BEHIND"
            if [ "$BEHIND" -gt 10 ]; then
              echo "::warning::$BEHIND commits since last deploy tag — consider shipping"
            fi
          else
            echo "::notice::No deploy tags found; skipping drift check"
          fi
