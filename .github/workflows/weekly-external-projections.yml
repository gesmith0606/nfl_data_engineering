name: weekly-external-projections

# Phase 73 EXTP-05: Refresh ESPN + Sleeper + Yahoo (FP proxy) projections
# twice per week (Tuesdays after MNF + Sundays pre-game).

on:
  schedule:
    - cron: '0 14 * * 2'   # Tuesday 14:00 UTC
    - cron: '0 12 * * 0'   # Sunday  12:00 UTC
  workflow_dispatch:
    inputs:
      season:
        description: 'NFL season year'
        required: false
        default: ''
      week:
        description: 'NFL week number'
        required: false
        default: ''
      scoring:
        description: 'Scoring format'
        required: false
        default: 'half_ppr'

permissions:
  contents: write

jobs:
  # Target season/week comes from the schedule-parquet resolver (the same one
  # weekly-pipeline uses), NOT a day-of-year rule: that rule filed week-18
  # data under season=2027/week=1 in January. workflow_dispatch inputs win.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      season: ${{ steps.nfl_week.outputs.season }}
      week: ${{ steps.nfl_week.outputs.week }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/resolve_pipeline_week.py
            data/bronze/schedules
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --quiet pandas pyarrow
      - name: Resolve season/week from the schedule
        id: nfl_week
        env:
          INPUT_SEASON: ${{ github.event.inputs.season }}
          INPUT_WEEK: ${{ github.event.inputs.week }}
          PIPELINE_WEEK_OVERRIDE: ${{ vars.PIPELINE_WEEK_OVERRIDE }}
        run: python scripts/resolve_pipeline_week.py

  ingest:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: [espn, sleeper, yahoo]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest ${{ matrix.source }} projections
        continue-on-error: true
        run: |
          python scripts/ingest_external_projections_${{ matrix.source }}.py \
            --season ${{ needs.resolve.outputs.season }} \
            --week ${{ needs.resolve.outputs.week }} \
            --scoring ${{ github.event.inputs.scoring || 'half_ppr' }} \
          || echo "::warning::${{ matrix.source }} ingest failed (see step logs above)"

      - name: Upload Bronze artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bronze-${{ matrix.source }}-${{ needs.resolve.outputs.season }}-w${{ needs.resolve.outputs.week }}
          path: data/bronze/external_projections/${{ matrix.source == 'yahoo' && 'yahoo_proxy_fp' || matrix.source }}/
          if-no-files-found: warn

  consolidate:
    needs: [resolve, ingest]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Count baseline Bronze files (pre-download)
        id: baseline
        run: |
          COUNT=$(git ls-files data/bronze/external_projections | wc -l)
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      # Each ingest job uploads data/bronze/external_projections/<source>/ and
      # upload-artifact roots the artifact AT that folder, so the <source>/
      # level is not inside the artifact. Merging every artifact straight into
      # data/bronze/external_projections/ therefore dropped the source folder
      # and filed all in-season files under season=YYYY/ at the top level —
      # where neither the Sleeper consensus anchor nor the Silver
      # consolidation looks (anchor fired on 0 rows for 2026 weeks 1-3).
      # Download per-artifact and put each back under its source folder.
      - name: Download all Bronze artifacts
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/ext_artifacts

      - name: Restore per-source Bronze folders
        run: |
          shopt -s nullglob
          for d in "${{ runner.temp }}"/ext_artifacts/bronze-*; do
            src=$(basename "$d" | cut -d- -f2)
            case "$src" in
              yahoo) dest=yahoo_proxy_fp ;;
              *) dest="$src" ;;
            esac
            mkdir -p "data/bronze/external_projections/$dest"
            cp -rn "$d"/. "data/bronze/external_projections/$dest/"
            echo "restored $(find "$d" -type f | wc -l) file(s) -> $dest/"
          done

      - name: Check for fresh Bronze data
        id: freshness
        run: |
          ON_DISK=$(find data/bronze/external_projections -type f | wc -l)
          FRESH=$(( ON_DISK - ${{ steps.baseline.outputs.count }} ))
          echo "fresh_files=$FRESH" >> $GITHUB_OUTPUT
          if [ "$FRESH" -le 0 ]; then
            echo "::warning::No fresh Bronze external-projections files arrived this run (all matrix ingest sources failed or returned 0 rows) -- skipping Silver consolidation and commit."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Consolidate to Silver
        if: steps.freshness.outputs.skip != 'true'
        run: |
          python scripts/silver_external_projections_transformation.py \
            --season ${{ needs.resolve.outputs.season }} \
            --week ${{ needs.resolve.outputs.week }} \
            --scoring ${{ github.event.inputs.scoring || 'half_ppr' }}

      - name: Commit Silver
        if: steps.freshness.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/silver/external_projections/ data/bronze/external_projections/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data(external-projections): refresh season=${{ needs.resolve.outputs.season }} week=${{ needs.resolve.outputs.week }}"
            git push
          fi
